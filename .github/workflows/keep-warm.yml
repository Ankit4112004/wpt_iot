name: Keep backend warm

# Render's free tier sleeps the service after ~15 min of no traffic, which causes a
# 30-60s cold start on the next visit. This pings the health endpoint on a schedule so
# the backend stays awake and the dashboard loads instantly.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 90 https://ev-wpt-api.onrender.com/health \
            || echo "ping failed (server may be cold-starting)"
